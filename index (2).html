<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeNet Alerts</title>
<style>
:root{--bg:#ffffff;--fg:#1d2330;--muted:#5a6376;--rule:#d9dde6;--link:#1a4fb3}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e8eaf0;--muted:#a3abbd;--rule:#2c3242;--link:#8fb4ff}}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 Georgia,"Times New Roman",serif}
main{max-width:42rem;margin:0 auto;padding:3rem 1.25rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:0 0 .25rem}
h2{font-size:1.2rem;margin:2.2rem 0 .4rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
p.meta{color:var(--muted);margin:0 0 1.5rem}
a{color:var(--link)}
a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>SafeNet Alerts</h1>
<p class="meta">A student project by Venkatkrishnan Iyer</p>
<p>SafeNet Alerts is a Raspberry Pi fall-detection prototype that sends a text message to its owner's phone when it detects a possible fall.</p>
<p><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms &amp; Conditions</a></p>
</main>
</body>
</html>
